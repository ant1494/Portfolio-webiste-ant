<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comic Colorist Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Netlify Identity Widget (Required for Decap CMS) -->
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="#" class="logo">YOUR NAME</a>
      <nav class="nav-links">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Portfolio Section -->
  <main class="main-content">
    <section id="work" class="gallery-section">
      <div class="gallery-grid">
        
        <!-- Project Card 1 -->
        <div class="project-card">
          <img src="https://via.placeholder.com/600x800" alt="Comic Work 1" />
          <div class="project-overlay">
            <h3>Project Title 01</h3>
            <p>Comic Coloring</p>
          </div>
        </div>

        <!-- Project Card 2 -->
        <div class="project-card">
          <img src="https://via.placeholder.com/600x800" alt="Comic Work 2" />
          <div class="project-overlay">
            <h3>Project Title 02</h3>
            <p>Comic Coloring</p>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
